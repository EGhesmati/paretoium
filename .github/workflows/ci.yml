name: Go CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/optimizer/go.mod
          cache-dependency-path: services/optimizer/go.sum
      - name: Run Go tests
        working-directory: services/optimizer
        run: go test ./...
